plugins {
    id 'java-library'
    id 'net.neoforged.gradle.userdev' version '7.0.144'
}

repositories {
    mavenCentral()
    maven { url 'https://maven.neoforged.net/releases/' }
}

dependencies {
    implementation project(':common')
    implementation "net.neoforged:neoforge:21.1.85"
}

tasks.jar {
    manifest {
        attributes(['Specification-Title': 'Chameleon NeoForge',
                    'Specification-Version': "${project.version}".replaceFirst('\\+.*', ''),
                    'Implementation-Title': 'Chameleon NeoForge',
                    'Implementation-Version': "${project.version}".replaceFirst('\\+.*', '')])
    }
}
