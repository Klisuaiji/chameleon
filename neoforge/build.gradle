plugins {
    id 'dev.architectury.loom'
    id 'architectury-plugin'
    id 'com.gradleup.shadow'
}

dependencies {
    minecraft "com.mojang:minecraft:1.21.1"
    mappings loom.layered {
        it.officialMojangMappings()
    }
    
    neoForge "net.neoforged:neoforge:21.1.85"
    
    implementation project(':common')
}

// 配置 shadowJar 包含 common 模块
shadowJar {
    // 包含 common 模块的输出
    from project(':common').tasks.shadowJar.outputs
    
    // 排除 NeoForge 和 Minecraft 相关库（由运行时提供）
    exclude 'net/neoforged/**'
    exclude 'net/minecraft/**'
    exclude 'com/mojang/**'
    exclude 'org/slf4j/**'
    exclude 'org/apache/logging/**'
    
    // 重命名 shaded 包
    relocate 'com.moandjiezana.toml', 'com.kulisaiji.chameleon.shaded.com.moandjiezana.toml'
    
    archiveClassifier.set('')
}

// 让 jar 任务依赖 shadowJar
tasks.jar {
    dependsOn shadowJar
    enabled = false
}

// 让 remapJar 使用 shadowJar 的输出
tasks.remapJar {
    dependsOn shadowJar
    inputFile.set(tasks.shadowJar.archiveFile)
}
